<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G-Marketing</title>
    <meta name="description" content="G-Marketing — האתר בהקמה." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0d12;
        --fg: #f5f6f8;
        --muted: #8b93a7;
        --accent: #4f8cff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 0%, #16203a 0%, var(--bg) 60%);
        color: var(--fg);
        font-family: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      h1 span {
        color: var(--accent);
      }

      p {
        margin: 20px 0 0;
        font-size: clamp(1rem, 3.5vw, 1.25rem);
        font-weight: 300;
        color: var(--muted);
      }

      hr {
        width: 64px;
        margin: 32px auto 0;
        border: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }

      small {
        display: block;
        margin-top: 32px;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>G<span>-</span>Marketing</h1>
      <p>האתר בהקמה. בקרוב כאן.</p>
      <hr />
      <small>g-marketing.net</small>
    </main>
  </body>
</html>
